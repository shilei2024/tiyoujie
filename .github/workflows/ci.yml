name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.13.1'
      - run: uv sync --project backend --frozen
      - run: uv run --project backend ruff check backend scripts tests
      - run: uv run --project backend ruff format --check backend scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py
      - run: npm ci
        working-directory: frontend
      - run: npm run type-check && npm run format:check && npm run build:h5 && npm run build:mp-weixin
        working-directory: frontend
      - run: python scripts/bootstrap.py
      - run: python scripts/project.py build
      - run: python scripts/project.py migrate
      - run: python scripts/project.py check
      - run: python scripts/project.py up
      - run: python scripts/project.py test
      - name: 生产编排与安全配置静态校验（合成值，不连外部服务）
        run: |
          cat > .env.prod <<'EOF'
          DJANGO_SECRET_KEY=ci-only-synthetic-secret-0123456789abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS=tiyoujie.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS=https://tiyoujie.example.com
          DB_NAME=tiyoujie
          DB_USER=tiyoujie
          DB_PASSWORD=ci-only-database-password
          POSTGRES_PASSWORD=ci-only-database-password
          TEST_POSTGRES_PASSWORD=ci-only-test-database-password
          REDIS_PASSWORD=ci-only-redis-password
          REDIS_URL=redis://:ci-only-redis-password@redis:6379/0
          API_IMAGE=tiyoujie-api:ci
          API_HOST_PORT=18010
          EOF
          COMPOSE="docker compose -p tiyoujie-ci --env-file .env.prod -f compose.yaml -f infra/deploy/compose.prod.yaml -f infra/deploy/compose.caddy.yaml"
          $COMPOSE config --quiet
          $COMPOSE run --rm --no-deps api python manage.py check --deploy
      - name: Python dependency audit
        run: uv run --project backend pip-audit
      - name: Frontend dependency audit (no advisory suppression)
        run: npm audit --audit-level=low --fetch-timeout=20000 --fetch-retries=1
        working-directory: frontend
      - name: Stop only this project, preserve volumes
        if: always()
        run: docker compose -p tiyoujie-local --profile test down

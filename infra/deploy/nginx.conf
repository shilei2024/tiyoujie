# 生产部署反向代理示例（未在真实主机验证，替换域名/证书路径后再使用）
# 仅代理 API；不提供目录列表，不代理静态媒体，导出与图片都走鉴权接口。

limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

upstream tiyoujie_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name api.example.invalid;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.invalid;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 9m;
    client_body_timeout 20s;
    keepalive_timeout 30s;
    server_tokens off;

    # 微信服务器回调与登录接口单独限速
    location = /api/v1/auth/wechat-login/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://tiyoujie_api;
        include /etc/nginx/proxy_params_tiyoujie.conf;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://tiyoujie_api;
        include /etc/nginx/proxy_params_tiyoujie.conf;
        proxy_read_timeout 20s;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://tiyoujie_api/api/v1/health/live/;
    }

    location / {
        return 404;
    }
}

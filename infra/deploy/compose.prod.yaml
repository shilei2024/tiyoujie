# 生产编排覆盖层：与根目录 compose.yaml 合并使用。
# 未在真实主机执行；先在预发布环境按 docs/operations/phase-7-deployment.md 验证。
# 用法：docker compose -f compose.yaml -f infra/deploy/compose.prod.yaml --env-file .env.prod up -d

x-prod-service: &prod-service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  api:
    <<: *prod-service
    image: ${API_IMAGE:?Set API_IMAGE to the reviewed image digest}
    ports: []
    environment: &prod-env
      APP_ENV: prod
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Required}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Required}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:?Required}
      DB_USER: ${DB_USER:?Required}
      DB_PASSWORD: ${DB_PASSWORD:?Required}
      REDIS_URL: ${REDIS_URL:?Use redis://:password@redis:6379/0 or rediss://}
      PRIVATE_STORAGE_ROOT: /app/private
      CREDENTIAL_KEYS_JSON: ${CREDENTIAL_KEYS_JSON:-}
      CREDENTIAL_ACTIVE_KEY_VERSION: ${CREDENTIAL_ACTIVE_KEY_VERSION:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      OCR_OUTBOUND_ENABLED: ${OCR_OUTBOUND_ENABLED:-0}
      AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-0}
      PLATFORM_AI_ENABLED: ${PLATFORM_AI_ENABLED:-0}
      PLATFORM_OCR_CONFIGURED_PROVIDERS: ${PLATFORM_OCR_CONFIGURED_PROVIDERS:-}
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "4"
      - --worker-tmp-dir
      - /tmp
      - --timeout
      - "25"
      - --graceful-timeout
      - "20"
      - --error-logfile
      - "-"
    volumes:
      - private_prod:/app/private
    mem_limit: 1g
    cpus: 2

  worker:
    <<: *prod-service
    image: ${API_IMAGE:?Set API_IMAGE to the reviewed image digest}
    environment:
      <<: *prod-env
      PLATFORM_OCR_KEY_DEEPSEEK: ${PLATFORM_OCR_KEY_DEEPSEEK:-}
      PLATFORM_OCR_KEY_KIMI: ${PLATFORM_OCR_KEY_KIMI:-}
    volumes:
      - private_prod:/app/private
    command:
      - celery
      - -A
      - config.celery:app
      - worker
      - --loglevel=WARNING
      - --concurrency=2
      - --max-tasks-per-child=100
      - --without-gossip
      - --without-mingle
    mem_limit: 1g
    cpus: 2

  beat:
    <<: *prod-service
    image: ${API_IMAGE:?Set API_IMAGE to the reviewed image digest}
    environment: *prod-env
    command:
      - celery
      - -A
      - config.celery:app
      - beat
      - --loglevel=WARNING
      - --schedule=/tmp/celerybeat-schedule

  postgres:
    <<: *prod-service
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Required}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Required}
    volumes:
      - postgres_prod:/var/lib/postgresql
      - ./infra/postgres/dev.sql:/docker-entrypoint-initdb.d/10-role.sql:ro
    mem_limit: 2g

  redis:
    <<: *prod-service
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?Required}
    volumes:
      - redis_prod:/data
    mem_limit: 768m

  nginx:
    <<: *prod-service
    image: nginx:1.29-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/deploy/proxy_params_tiyoujie.conf:/etc/nginx/proxy_params_tiyoujie.conf:ro
      - ./infra/deploy/tls:/etc/nginx/tls:ro
      - nginx_logs:/var/log/nginx
    networks:
      - edge
    mem_limit: 256m

volumes:
  postgres_prod:
  redis_prod:
  private_prod:
  nginx_logs:

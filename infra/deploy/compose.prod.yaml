# 生产编排覆盖层：与根目录 compose.yaml 合并使用。
#
# 目标主机实测拓扑（2026-10-24）：
#   * 80/443 由既有容器 mindfulpenpal-ai-production-caddy-1 占用，
#     其 Caddyfile 通过 bind mount 挂在
#     /opt/mytoolbox/services/generation-service/deploy/Caddyfile.production；
#   * 同网络上的 tongyan-api 已占用 DNS 别名 `api`，因此本项目**不加入**该网络，
#     改为把 API 绑到 docker0 网关（默认 172.17.0.1），由 Caddy 经
#     host.docker.internal 回源。这样既不抢别名、也不向公网发布端口。
#
# 用法：
#   docker compose --env-file .env.prod -f compose.yaml -f infra/deploy/compose.prod.yaml \
#     -p tiyoujie up -d --wait
# 常规发布请直接用 infra/deploy/deploy.sh。

x-prod-service: &prod-service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *prod-service
    image: ${API_IMAGE:?Set API_IMAGE to the reviewed image digest}
    # 与 deploy.sh 的 --build-arg 保持一致：受限网络下不填镜像会构建失败。
    build:
      args:
        PYPI_INDEX: ${PYPI_INDEX:-https://pypi.org/simple}
        PYPI_FILES_HOST: ${PYPI_FILES_HOST:-}
    # !override 才是“替换列表”，直接写 ports 是追加。
    # 只绑 docker0，公网 IP 上不监听；容器与宿主机可用，外部不可达。
    ports: !override
      - "${API_BIND_IP:-172.17.0.1}:${API_HOST_PORT:?Required}:8000"
    environment: &prod-env
      APP_ENV: prod
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Required}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Required}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:?Required}
      DB_USER: ${DB_USER:?Required}
      DB_PASSWORD: ${DB_PASSWORD:?Required}
      REDIS_URL: ${REDIS_URL:?Use redis://:password@redis:6379/0 or rediss://}
      PRIVATE_STORAGE_ROOT: /app/private
      CREDENTIAL_KEYS_JSON: ${CREDENTIAL_KEYS_JSON:-}
      CREDENTIAL_ACTIVE_KEY_VERSION: ${CREDENTIAL_ACTIVE_KEY_VERSION:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      OCR_OUTBOUND_ENABLED: ${OCR_OUTBOUND_ENABLED:-0}
      AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-0}
      PLATFORM_AI_ENABLED: ${PLATFORM_AI_ENABLED:-0}
      PLATFORM_OCR_CONFIGURED_PROVIDERS: ${PLATFORM_OCR_CONFIGURED_PROVIDERS:-}
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      # 主机 4 vCPU / 3.7G 且已承载其它服务，2 个 worker 足够本量级。
      - --workers
      - "2"
      - --worker-tmp-dir
      - /tmp
      - --timeout
      - "25"
      - --graceful-timeout
      - "20"
      - --max-requests
      - "800"
      - --max-requests-jitter
      - "100"
      - --error-logfile
      - "-"
    volumes:
      - private_prod:/app/private
    mem_limit: 640m
    cpus: 1.5

  worker:
    <<: *prod-service
    image: ${API_IMAGE:?Set API_IMAGE to the reviewed image digest}
    environment:
      <<: *prod-env
      PLATFORM_OCR_KEY_DEEPSEEK: ${PLATFORM_OCR_KEY_DEEPSEEK:-}
      PLATFORM_OCR_KEY_KIMI: ${PLATFORM_OCR_KEY_KIMI:-}
    volumes:
      - private_prod:/app/private
    command:
      - celery
      - -A
      - config.celery:app
      - worker
      - --loglevel=WARNING
      - --concurrency=1
      - --max-tasks-per-child=100
      - --without-gossip
      - --without-mingle
    mem_limit: 512m
    cpus: 1

  beat:
    <<: *prod-service
    image: ${API_IMAGE:?Set API_IMAGE to the reviewed image digest}
    environment: *prod-env
    command:
      - celery
      - -A
      - config.celery:app
      - beat
      - --loglevel=WARNING
      - --schedule=/tmp/celerybeat-schedule
    mem_limit: 192m
    cpus: 0.5

  postgres:
    <<: *prod-service
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Required}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Required}
      APP_DB_USER: ${DB_USER:?Required}
      APP_DB_NAME: ${DB_NAME:?Required}
    volumes:
      - postgres_prod:/var/lib/postgresql
      # 生产库名/角色来自 .env.prod，必须用参数化脚本（dev.sql 写死了 tiyoujie_dev）。
      - ./infra/postgres/prod.sql:/docker-entrypoint-initdb.d/10-role.sql:ro
    # 与既有 mindfulpenpal postgres 共存，不宜占满内存。
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - max_connections=60
      - -c
      - effective_cache_size=512MB
    mem_limit: 768m
    cpus: 1

  redis:
    <<: *prod-service
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?Required}
    volumes:
      - redis_prod:/data
    mem_limit: 256m
    cpus: 0.5

volumes:
  postgres_prod:
  redis_prod:
  private_prod:

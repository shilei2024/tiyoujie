[project]
name = "tiyoujie-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django==5.2.18",
  "djangorestframework==3.18.3",
  "celery[redis]==5.6.3",
  "psycopg[binary]==3.3.6",
  "gunicorn==26.2.0",
  "cryptography==50.0.2",
  "whitenoise==6.12.0",
  "Pillow==13.0.0",
]

[dependency-groups]
dev = ["ruff==0.17.1", "pip-audit==2.10.1", "pre-commit==4.7.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
